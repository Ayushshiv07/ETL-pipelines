name: ETL Pipeline CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas sqlalchemy pyyaml faker pytest plotly streamlit

      - name: Generate 100K sample data
        run: python scripts/generate_data.py

      - name: Run ETL pipeline (Extract → Transform → Validate → Load)
        run: python scripts/run_pipeline.py --mode full

      - name: Run unit tests (22 tests)
        run: pytest tests/ -v --tb=short

      - name: Verify warehouse row counts
        run: python scripts/run_analytics.py
